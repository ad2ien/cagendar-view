name: Lint and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: "npm"

      - name: Install Dependencies
        run: yarn

      - name: Run ESLint
        run: yarn lint

      - name: Run Prettier
        run: npx prettier --check .

  docker-build:
    needs: lint
    name: Just build docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
